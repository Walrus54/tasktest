rules:
  - id: android-deeplink-overly-broad-pathprefix
    patterns:
      - pattern-inside: |
          <intent-filter ...>
            ...
          </intent-filter>
      - pattern: <data android:scheme="https" android:pathPrefix="/" ... />
    message: "Deep link pathPrefix=\"/\" matches all paths on the domain instead of a specific endpoint"
    severity: ERROR
    languages:
      - xml
    metadata:
      category: security
      cwe: "CWE-939: Improper Authorization in Handler for Custom URL Scheme"
      owasp: "M1: Improper Platform Usage"
