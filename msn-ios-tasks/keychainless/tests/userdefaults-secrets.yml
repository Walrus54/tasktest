rules:
  - id: userdefaults-for-secrets
    patterns:
      - pattern-either:
          - pattern: 'UserDefaults.standard.set($VAL, forKey: $KEY)'
          - pattern: 'UserDefaults.standard.setValue($VAL, forKey: $KEY)'
          - pattern: '$DEFAULTS.set($VAL, forKey: $KEY)'
          - pattern: '$DEFAULTS.setValue($VAL, forKey: $KEY)'
      - metavariable-regex:
          metavariable: $KEY
          regex: '".*(token|password|secret|key).*"'
    message: "Sensitive data stored in UserDefaults - readable from unencrypted device backups"
    severity: ERROR
    languages:
      - swift
    metadata:
      category: security
      cwe: "CWE-311: Missing Encryption of Sensitive Data"
      owasp: "M2: Inadequate Supply Chain Security"
